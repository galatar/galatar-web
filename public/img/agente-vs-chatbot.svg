<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Cómo trabaja un agente de IA</title>
  <desc id="desc">A la izquierda, un chatbot: tú estás en medio, copias y pegas entre el chat y tus archivos, y con cada error das otra vuelta. A la derecha, un agente: tú le haces el encargo, el agente lee, hace, comprueba y corrige trabajando con tus archivos, y te devuelve el resultado para que lo revises.</desc>
  <defs>
    <radialGradient id="brillo" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#a01a42" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a01a42" stop-opacity="0"/>
    </radialGradient>
    <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7cf7a"/>
    </marker>
    <marker id="fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0577f"/>
    </marker>
  </defs>

  <!-- Fondo de noche -->
  <rect width="1200" height="630" fill="#0b0710"/>
  <rect width="1200" height="630" fill="url(#brillo)"/>
  <g fill="#fff0d2">
    <circle cx="144" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="936" cy="30" r="1" opacity="0.5"/>
    <circle cx="1110" cy="96" r="1.5" fill="#f7cf7a" opacity="0.7"/>
    <circle cx="360" cy="110" r="1" opacity="0.4"/>
    <circle cx="1170" cy="600" r="1.2" opacity="0.4"/>
    <circle cx="20" cy="590" r="1.5" fill="#f7cf7a" opacity="0.5"/>
    <circle cx="600" cy="610" r="1" opacity="0.35"/>
  </g>

  <!-- Título -->
  <g font-family="Atkinson Hyperlegible, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <path d="M60 30 l3.3 9.9 9.9 3.3 -9.9 3.3 -3.3 9.9 -3.3 -9.9 -9.9 -3.3 9.9 -3.3z" fill="#f0b13f"/>
    <text x="80" y="49" font-size="14" font-weight="700" letter-spacing="2.2" fill="#f0b13f">GALATAR</text>
  </g>
  <text x="600" y="82" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="#f3ede4">¿Cómo trabaja un agente de IA?</text>
  <text x="600" y="114" text-anchor="middle" font-family="Atkinson Hyperlegible, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#bdb2b8">Comparado con un chatbot en el que vas copiando y pegando</text>

  <g font-family="Atkinson Hyperlegible, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">

    <!-- ============ CHATBOT ============ -->
    <rect x="40" y="140" width="540" height="450" rx="18" fill="#150c17" stroke="#f0b13f" stroke-opacity="0.18"/>
    <text x="70" y="182" font-size="13" font-weight="700" letter-spacing="2" fill="#8a7f86">CHATBOT</text>
    <text x="70" y="218" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#f3ede4">Tú haces de mensajero</text>

    <!-- Chat de IA -->
    <rect x="70" y="320" width="120" height="80" rx="14" fill="#1f1221" stroke="#f0b13f" stroke-width="2"/>
    <text x="130" y="355" text-anchor="middle" font-size="17" font-weight="700" fill="#f3ede4">Chat</text>
    <text x="130" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#f3ede4">de IA</text>

    <!-- Tú -->
    <circle cx="310" cy="360" r="44" fill="#a01a42"/>
    <text x="310" y="367" text-anchor="middle" font-size="20" font-weight="700" fill="#f3ede4">Tú</text>

    <!-- Archivos -->
    <rect x="430" y="320" width="120" height="80" rx="14" fill="#1f1221" stroke="#8a7f86" stroke-width="2"/>
    <text x="490" y="355" text-anchor="middle" font-size="17" font-weight="700" fill="#f3ede4">Tus</text>
    <text x="490" y="377" text-anchor="middle" font-size="17" font-weight="700" fill="#f3ede4">archivos</text>

    <!-- Copiar y pegar -->
    <g stroke="#f7cf7a" stroke-width="2" fill="none">
      <line x1="262" y1="345" x2="196" y2="345" marker-end="url(#fl)"/>
      <line x1="196" y1="375" x2="262" y2="375" marker-end="url(#fl)"/>
      <line x1="358" y1="345" x2="424" y2="345" marker-end="url(#fl)"/>
      <line x1="424" y1="375" x2="358" y2="375" marker-end="url(#fl)"/>
    </g>
    <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#f7cf7a" text-anchor="middle">
      <text x="228" y="334">Ctrl+V</text>
      <text x="228" y="396">Ctrl+C</text>
      <text x="392" y="334">Ctrl+V</text>
      <text x="392" y="396">Ctrl+C</text>
    </g>

    <!-- Vuelta por cada error -->
    <path d="M490 408 C 490 470, 130 470, 130 408" fill="none" stroke="#e0577f" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#fl-gris)"/>
    <text x="310" y="488" text-anchor="middle" font-size="15" fill="#e0577f">con cada error, otra vuelta</text>

    <line x1="70" y1="518" x2="550" y2="518" stroke="#f0b13f" stroke-opacity="0.16"/>
    <text x="70" y="556" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="21" fill="#e0577f">La IA solo ve lo que tú le pegas.</text>

    <!-- ============ AGENTE ============ -->
    <rect x="620" y="140" width="540" height="450" rx="18" fill="#150c17" stroke="#f0b13f" stroke-opacity="0.45"/>
    <text x="650" y="182" font-size="13" font-weight="700" letter-spacing="2" fill="#f0b13f">AGENTE DE IA</text>
    <text x="650" y="218" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#f3ede4">La IA trabaja con tus archivos</text>

    <!-- Tú -->
    <circle cx="680" cy="362" r="40" fill="#a01a42"/>
    <text x="680" y="369" text-anchor="middle" font-size="20" font-weight="700" fill="#f3ede4">Tú</text>

    <!-- Encargo y resultado -->
    <g stroke="#f7cf7a" stroke-width="2" fill="none">
      <line x1="724" y1="347" x2="784" y2="347" marker-end="url(#fl)"/>
      <line x1="784" y1="377" x2="724" y2="377" marker-end="url(#fl)"/>
    </g>
    <text x="754" y="336" text-anchor="middle" font-size="12" fill="#f7cf7a">encargo</text>
    <text x="754" y="398" text-anchor="middle" font-size="12" fill="#f7cf7a">resultado</text>

    <!-- Agente con su bucle -->
    <rect x="790" y="270" width="200" height="180" rx="16" fill="#1f1221" stroke="#f0b13f" stroke-width="2"/>
    <text x="890" y="297" text-anchor="middle" font-size="17" font-weight="700" fill="#f0b13f">Agente</text>
    <circle cx="890" cy="372" r="46" fill="none" stroke="#f0b13f" stroke-width="2"/>
    <g fill="#f0b13f">
      <path d="M-5 -5 L5 0 L-5 5z" transform="translate(925.2 342.4) rotate(50)"/>
      <path d="M-5 -5 L5 0 L-5 5z" transform="translate(927.7 398.4) rotate(125)"/>
      <path d="M-5 -5 L5 0 L-5 5z" transform="translate(852.3 398.4) rotate(235)"/>
      <path d="M-5 -5 L5 0 L-5 5z" transform="translate(852.3 345.6) rotate(305)"/>
    </g>
    <g font-size="13" font-weight="700" fill="#1a0d05" text-anchor="middle">
      <rect x="866" y="315" width="48" height="22" rx="11" fill="#f0b13f"/>
      <text x="890" y="331">Lee</text>
      <rect x="911" y="361" width="52" height="22" rx="11" fill="#f0b13f"/>
      <text x="937" y="377">Hace</text>
      <rect x="846" y="407" width="88" height="22" rx="11" fill="#f0b13f"/>
      <text x="890" y="423">Comprueba</text>
      <rect x="810" y="361" width="64" height="22" rx="11" fill="#f0b13f"/>
      <text x="842" y="377">Corrige</text>
    </g>

    <!-- Archivos -->
    <line x1="996" y1="362" x2="1029" y2="362" stroke="#f7cf7a" stroke-width="2" marker-start="url(#fl)" marker-end="url(#fl)"/>
    <rect x="1035" y="322" width="100" height="80" rx="14" fill="#1f1221" stroke="#8a7f86" stroke-width="2"/>
    <text x="1085" y="357" text-anchor="middle" font-size="17" font-weight="700" fill="#f3ede4">Tus</text>
    <text x="1085" y="379" text-anchor="middle" font-size="17" font-weight="700" fill="#f3ede4">archivos</text>

    <text x="890" y="488" text-anchor="middle" font-size="15" fill="#f0b13f">repite hasta que sale bien</text>

    <line x1="650" y1="518" x2="1130" y2="518" stroke="#f0b13f" stroke-opacity="0.16"/>
    <text x="650" y="556" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="21" fill="#f7cf7a">Tú encargas y revisas. La IA prueba y corrige.</text>
  </g>
</svg>
